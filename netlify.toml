[build]
  command = "npx quartz build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Enable Netlify Identity (for OAuth)
[context.production]
  environment = { NETLIFY_USE_YARN = "false" }

# Redirect rules for authentication
# This will be managed by Netlify Identity widget

# Optional: Custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
